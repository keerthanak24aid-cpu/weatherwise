<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Prediction App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header class="header">
        <h1>Weather Prediction</h1>
        <p class="tagline">Fast, friendly and actionable local weather</p>
    </header>

    <div class="search">
        <input type="text" id="cityInput" placeholder="Enter city or ZIP code" aria-label="City">
        <button id="searchBtn">Check Weather</button>
    </div>

    <div id="weatherResult" class="card hidden"></div>

    <footer class="footer">Powered by OpenWeather • Professional UI</footer>
</div>

<script src="script.js"></script>
</body>
</html>
